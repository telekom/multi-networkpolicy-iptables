name: govulncheck
on:
  push:
    branches:
      - main
      - master
      - nftables
  pull_request:
  schedule:
    # Run weekly on Mondays at 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Known unfixed vulnerabilities in transitive dependencies (no upstream fix available):
        #   GO-2025-3547: k8s.io/kubernetes@v1.35.1 - no fix released yet
        #   GO-2025-3521: k8s.io/kubernetes@v1.35.1 - no fix released yet
        # continue-on-error is set to true until upstream releases a fix for the above.
        # Remove continue-on-error once k8s.io/kubernetes provides a patched version.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
